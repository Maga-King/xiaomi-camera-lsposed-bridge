name: 构建完整 r17 模块 APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 下载完整算法、模型、基线与构建工具
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download native-r17-materials --repo Maga-King/xiaomi-camera-lsposed-bridge --pattern 'XiaomiCameraLSPosed-native-r17-materials.zip' --dir .materials
          python -c "import zipfile; zipfile.ZipFile('.materials/XiaomiCameraLSPosed-native-r17-materials.zip').extractall('.materials')"
      - name: 安装匹配 Android 工具链
        run: sdkmanager 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: 重编译 Smali 与 native、校验依赖、签名成品
        env:
          CAMERA_SIGNING_KEYSTORE_B64: ${{ secrets.CAMERA_SIGNING_KEYSTORE_B64 }}
          CAMERA_SIGNING_PASSWORD: ${{ secrets.CAMERA_SIGNING_PASSWORD }}
        run: python ci/build_r17.py
      - uses: actions/upload-artifact@v4
        with:
          name: XiaomiCameraLSPosed-native-r17-完整成品
          path: |
            out/*.apk
            out/构建说明.json
            docs/使用说明.md
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
